[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardionet-agentbench"
version = "0.1.0"
description = "Reproducible CPU-first deep-learning benchmark for multi-label ECG classification on PTB-XL."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CardioNet-AgentBench Research"}]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
  "torch>=2.1",
  "wfdb>=4.1",
  "tqdm>=4.65",
  "matplotlib>=3.7",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
huggingface = ["huggingface_hub>=0.23", "gradio>=4.0"]

[project.scripts]
cardionet = "cardionet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
